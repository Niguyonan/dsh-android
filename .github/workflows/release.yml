name: release

# Builds the APK and attaches it to a GitHub release.
#
# Everything is built from the tag: the app and the on-device runtime inside it
# come out of the same commit, and `android/build.sh` refuses to report a build
# whose signature does not verify. The payload id and the APK's sha256 go into
# the release notes, so a device can be matched to a release without trusting
# anyone's summary of it.
#
# Signing comes from repository secrets when they exist (see
# android/keystore/README.md). Without them this still publishes, debug-signed,
# and says so in the notes — a release that cannot be produced is worse than one
# that names the key it used.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name for a non-tag build (e.g. 0.2.0-dev)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Version
        id: version
        run: |
          set -eu
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            name="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ inputs.version }}" ]; then
            name="${{ inputs.version }}"
          else
            name="0.0.0-dev"
          fi
          # Monotonic across runs, which is all Android asks of a version code.
          echo "name=$name" >>"$GITHUB_OUTPUT"
          echo "code=$GITHUB_RUN_NUMBER" >>"$GITHUB_OUTPUT"
          echo "building $name ($GITHUB_RUN_NUMBER)"

      - name: Android SDK
        run: |
          set -eu
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$sdk" ] || [ ! -d "$sdk" ]; then
            echo "::error::no Android SDK on this runner (ANDROID_HOME unset)"
            exit 1
          fi
          echo "sdk: $sdk"
          ls "$sdk/build-tools" || true
          ls "$sdk/platforms" || true

      - name: Signing key
        id: key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -eu
          if [ -n "${KS_B64:-}" ]; then
            printf '%s' "$KS_B64" | base64 -d >"$RUNNER_TEMP/release.keystore"
            {
              echo "DSH_KS_FILE=$RUNNER_TEMP/release.keystore"
              echo "DSH_KS_PASS=$KS_PASS"
              echo "DSH_KS_ALIAS=${KS_ALIAS:-dshd}"
            } >>"$GITHUB_ENV"
            echo "signed=release" >>"$GITHUB_OUTPUT"
            echo "using the release keystore from secrets"
          else
            echo "signed=debug" >>"$GITHUB_OUTPUT"
            echo "::warning::no ANDROID_KEYSTORE_BASE64 secret — this APK will be debug-signed"
          fi

      - name: Build the APK
        run: |
          set -eu
          sh android/build.sh \
            --version-name "${{ steps.version.outputs.name }}" \
            --version-code "${{ steps.version.outputs.code }}" \
            --out "dist/dshd-${{ steps.version.outputs.name }}.apk"

      - name: Verify what was built
        run: |
          set -eu
          apk="dist/dshd-${{ steps.version.outputs.name }}.apk"
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          bt="$sdk/build-tools/$(ls "$sdk/build-tools" | sort -n | tail -n 1)"
          "$bt/apksigner" verify --min-sdk-version 24 --print-certs "$apk"
          # The payload the APK ships is the one this commit builds: the release
          # notes claim it, so the build checks it.
          unzip -p "$apk" assets/payload.id | diff - android/assets/payload.id
          echo "apk-sha256=$(sha256sum "$apk" | cut -d' ' -f1)" >>"$GITHUB_ENV"
          echo "payload-id=$(cat android/assets/payload.id)" >>"$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: dshd-${{ steps.version.outputs.name }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Release notes
        run: |
          set -eu
          apk="dshd-${{ steps.version.outputs.name }}.apk"
          if [ "${{ steps.key.outputs.signed }}" = "release" ]; then
            signed="signed with the release keystore"
          else
            signed="**debug-signed**: installable, not for distribution, and not upgrade-compatible with a properly signed build"
          fi
          # The heredoc is indented to sit inside this YAML block, and YAML
          # block scalars keep that indentation; markdown does not want it.
          cat >dist/notes.md <<EOF
          DeepSeek Harness for Android ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})

          | | |
          |---|---|
          | APK | \`$apk\` |
          | SHA-256 | \`${{ env.apk-sha256 }}\` |
          | Payload | \`${{ env.payload-id }}\` |
          | Signature | $signed |
          | Commit | ${{ github.sha }} |

          Install it, open it, grant root once, tap **Set up**. Requirements and the
          first-run walkthrough are in the [README](https://github.com/${{ github.repository }}#install);
          what the app does with root is in [docs/security.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/security.md).

          Build inputs, for anyone checking this rather than trusting it: the on-device
          runtime inside the APK is built from this commit by \`tools/mkpayload.sh\`, and
          its id above is a digest of the file manifest the device verifies before
          installing anything.
          EOF
          sed -e 's/^ *//' dist/notes.md >dist/notes.trimmed
          mv dist/notes.trimmed dist/notes.md
          cat dist/notes.md

      - name: Publish
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release create "$GITHUB_REF_NAME" \
            "dist/dshd-${{ steps.version.outputs.name }}.apk" \
            --title "DeepSeek Harness for Android ${{ steps.version.outputs.name }}" \
            --notes-file dist/notes.md \
            --verify-tag
